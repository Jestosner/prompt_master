<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="koala-fur" x1="64" y1="30" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8B5C4"/>
      <stop offset="100%" stop-color="#768599"/>
    </linearGradient>
    <linearGradient id="koala-ear" x1="64" y1="30" x2="64" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="koala-nose" x1="64" y1="56" x2="64" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="48" y1="94" x2="80" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Outer fluffy ears (inside 13..115 safe margin) -->
  <circle cx="33" cy="50" r="19" fill="url(#koala-ear)" stroke="#1E293B" stroke-width="3.5"/>
  <circle cx="95" cy="50" r="19" fill="url(#koala-ear)" stroke="#1E293B" stroke-width="3.5"/>

  <!-- Inner ear fluff -->
  <circle cx="35" cy="51" r="11" fill="#F1F5F9"/>
  <circle cx="93" cy="51" r="11" fill="#F1F5F9"/>
  <path d="M29 49C31 46 35 45 38 47" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M99 49C97 46 93 45 90 47" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head + subtle top fur tuft -->
  <path d="M28 67C28 48 43 34 60 34C61.5 31 64 29 66.5 31C67.5 32 68 33 68.5 34.2C85.5 35 100 48.5 100 67C100 86 84.5 99 64 99C43.5 99 28 86 28 67Z" fill="url(#koala-fur)" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Soft face highlight -->
  <ellipse cx="64" cy="74" rx="23" ry="17" fill="#E2E8F0" fill-opacity="0.45"/>

  <!-- Rosy cheeks -->
  <ellipse cx="41" cy="73" rx="5.5" ry="3.2" fill="#FDA4AF" fill-opacity="0.65"/>
  <ellipse cx="87" cy="73" rx="5.5" ry="3.2" fill="#FDA4AF" fill-opacity="0.65"/>

  <!-- Eyes -->
  <circle cx="46" cy="63" r="4.8" fill="#0F172A"/>
  <circle cx="44.4" cy="61.4" r="1.6" fill="#FFFFFF"/>
  <circle cx="82" cy="63" r="4.8" fill="#0F172A"/>
  <circle cx="80.4" cy="61.4" r="1.6" fill="#FFFFFF"/>

  <!-- Iconic koala oval nose -->
  <rect x="55" y="57" width="18" height="24" rx="9" fill="url(#koala-nose)" stroke="#0F172A" stroke-width="1.5"/>
  <ellipse cx="61.2" cy="63.5" rx="2.3" ry="4.2" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Gentle smile -->
  <path d="M57.5 86C60.5 90 67.5 90 70.5 86" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Small eucalyptus leaf accent under chin -->
  <path d="M64 101C58 95 49 95 46 100C49 105 58 106 64 101Z" fill="url(#leaf-grad)" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M64 101C70 95 79 95 82 100C79 105 70 106 64 101Z" fill="url(#leaf-grad)" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="64" cy="101" r="2.2" fill="#065F46"/>
</svg>
